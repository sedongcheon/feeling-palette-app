name: feeling_palette
description: "AI 감정일기 앱 - Feeling Palette"
publish_to: 'none'
version: 1.0.5+19

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  http: ^1.2.2
  provider: ^6.1.2
  table_calendar: ^3.1.3
  intl: ^0.20.2
  share_plus: ^11.1.0
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  google_mobile_ads: ^5.2.0
  app_tracking_transparency: ^2.0.6
  in_app_purchase: ^3.2.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  # Voice journal (exec-plan 002-voice-journal)
  # speech_to_text는 live mic + STT를 한 패키지에서 제공하므로 record를
  # 따로 두지 않는다. 오디오 파일 보관은 spec out of scope.
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/splash/

# 부트 시 흰 화면 노출을 막기 위한 네이티브 스플래시. 라이트/다크 모두 앱
# 팔레트의 background에 맞춤. Android 12+는 별도 섹션이 필요해 동일 색상으로
# 미러링. `dart run flutter_native_splash:create` 한 번 실행해서 ios
# LaunchScreen + android drawable이 생성된다.
flutter_native_splash:
  color: "#FAFAF8"
  image: assets/splash/icon.png
  color_dark: "#1A1A2E"
  image_dark: assets/splash/icon.png
  android_12:
    color: "#FAFAF8"
    image: assets/splash/icon.png
    color_dark: "#1A1A2E"
    image_dark: assets/splash/icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFE8F4"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
